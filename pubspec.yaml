name: queroobras_mobile
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev


version: 1.0.0+3

environment:
  sdk: ^3.10.0-75.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  get_storage: ^2.1.1
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  http: ^1.5.0
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  google_fonts: ^6.3.2
  google_maps_flutter: ^2.7.0
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.0.15
  image_picker: ^1.2.1
  file_picker: ^10.3.7
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.0.3
  slide_to_confirm: ^1.1.0
  overlay_support: ^2.1.0
  fluttertoast: ^9.0.0
  webview_flutter: ^4.13.0
  flutter_rating_bar: ^4.0.0
  firebase_core: ^4.3.0
  cloud_firestore: ^6.1.1
  localization: ^2.1.1
  flutter_localization: ^0.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  fonts:
    - family: Josefin Sans
      fonts:
        - asset: assets/fonts/JosefinSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/JosefinSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/JosefinSans-Bold.ttf
          weight: 700
#    - family: SF Pro
#      fonts:
#        - asset: assets/fonts/SFPro-Regular.ttf
#          weight: 400
#        - asset: assets/fonts/SFPro-Semibold.ttf
#          weight: 500

